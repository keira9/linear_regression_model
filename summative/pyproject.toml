[project]
name = "seen-loan-estimator"
version = "0.1.0"
description = "Estimates the loan size an African woman entrepreneur can raise on Kiva, served with FastAPI to a Flutter app."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "scikit-learn>=1.6",
    "pandas>=2.2",
    "numpy>=2.0",
    "joblib>=1.4",
]

[dependency-groups]
notebook = ["jupyterlab>=4.2", "matplotlib>=3.9", "seaborn>=0.13", "nbconvert>=7.16"]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.uv]
default-groups = []

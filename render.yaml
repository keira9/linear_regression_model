# Optional: in Render choose New > Blueprint and pick this repository to create the service from this file.
services:
  - type: web
    name: seen-loan-api
    runtime: python
    plan: free
    rootDir: summative/API
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn prediction:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
